<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALZARÉ — Tienda</title>
<link rel="stylesheet" href="styles.css">
<link rel="manifest" href="manifest.json">
</head>
<body>
<header class="header">
  <div class="brand">ALZARÉ</div>
  <nav class="nav">
    <button onclick="filterCategory('Todos')">Todos</button>
    <button onclick="filterCategory('Hombre')">Hombre</button>
    <button onclick="filterCategory('Mujer')">Mujer</button>
    <button onclick="filterCategory('Unisex')">Unisex</button>
    <a href="admin.html" class="admin">Admin</a>
    <div id="cartBtn" class="cart" onclick="toggleCart()">🛒 <span id="cartCount">0</span></div>
  </nav>
</header>

<main>
  <section class="hero">
    <div class="hero-inner">
      <h1>Nuevo — Colección ALZARÉ</h1>
      <p>Moda premium — Negro & Dorado</p>
    </div>
  </section>

  <section id="catalog" class="catalog"></section>

  <div id="productModal" class="modal hidden"></div>
</main>

<aside id="cartPanel" class="cart-panel hidden">
  <h3>Carrito</h3>
  <div id="cartItems"></div>
  <div class="totals">
    <div>Subtotal: <span id="subtotal">0.00</span> USD</div>
    <div>Envío: <span id="shipping">0.00</span> USD</div>
    <div>Descuento: <span id="discount">0.00</span> USD</div>
    <div class="grand">Total: <span id="grandTotal">0.00</span> USD</div>
  </div>
  <div class="cart-actions">
    <input id="coupon" placeholder="Código de descuento">
    <button id="applyCoupon">Aplicar</button>
    <button id="checkoutWhats">Comprar por WhatsApp</button>
    <button id="checkoutStripe">Pagar con tarjeta</button>
  </div>
</aside>

<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js');
}
</script>

<!-- Product Modal -->
<div id="productModal" class="modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); align-items:center; justify-content:center; padding:20px;">
  <div class="modal-content" style="background:#fff; max-width:500px; width:100%; padding:20px; border-radius:8px; position:relative;">
    <button id="modalClose" style="position:absolute; top:10px; right:10px;">✕</button>
    <img id="modalImage" src="" style="width:100%; border-radius:6px; margin-bottom:15px;">
    <h2 id="modalTitle"></h2>
    <p id="modalPrice"></p>

    <div>
      <label>Talla:</label>
      <div id="modalSizes" style="display:flex; gap:8px; margin:8px 0;"></div>
    </div>

    <div>
      <label>Color:</label>
      <div id="modalColors" style="display:flex; gap:8px; margin:8px 0;"></div>
    </div>

    <div>
      <label>Cantidad:</label>
      <input id="modalQty" type="number" min="1" value="1" style="width:60px;">
    </div>

    <button id="modalAddCart" style="margin-top:15px; padding:10px; width:100%;">Agregar al carrito</button>
    <button id="modalBuyNow" style="margin-top:10px; padding:10px; width:100%;">Comprar ahora</button>
  </div>
</div>

</body>
</html>
